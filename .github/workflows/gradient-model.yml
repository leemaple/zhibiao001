name: Actual model gradient secret aggregation
on:
  workflow_dispatch:
  push:
    branches: ['codex/**']
    paths: ['gradient-benchmark.json','programs/gradient_share_sum.mpc','scripts/model_gradient_worker.py','scripts/run_gradient_benchmark.py','.github/workflows/gradient-model.yml']
permissions:
  contents: read
jobs:
  model-gradient:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned numerical and native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgmp-dev libsodium-dev libssl-dev libboost-thread-dev libboost-filesystem-dev libboost-iostreams-dev
          python3 -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.6.1
          python3 -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Existing MPC backend
        run: python3 scripts/install_mpspdz.py
      - name: Compute real gradients and aggregate as shares
        run: python3 scripts/run_gradient_benchmark.py
      - name: Preserve public test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-gradient-${{ github.run_id }}-${{ github.run_attempt }}
          path: results-gradient/
          retention-days: 30
