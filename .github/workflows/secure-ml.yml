name: Public LR and linear SVM train and infer
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths: ['ml-benchmark.json', 'programs/ml_common.py', 'programs/secure_*.mpc', 'scripts/run_ml_benchmark.py', '.github/workflows/secure-ml.yml']
permissions:
  contents: read
jobs:
  secure-ml:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned numerical and runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgmp-dev libsodium-dev libssl-dev libboost-thread-dev libboost-filesystem-dev libboost-iostreams-dev
          python3 -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.6.1
      - name: Verify and prepare official MP-SPDZ binary distribution
        run: python3 scripts/install_mpspdz.py
      - name: Run train, persist shares, independent infer and numerical comparison
        run: python3 scripts/run_ml_benchmark.py --output results-ml
      - name: Preserve complete public-data evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-secure-ml-${{ github.run_id }}-${{ github.run_attempt }}
          path: results-ml/
          if-no-files-found: warn
          retention-days: 30
