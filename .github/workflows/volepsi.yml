name: Native VOLE-PSI correctness and scale
on:
  workflow_dispatch:
  push:
    branches: ['codex/**']
    paths: ['volepsi-benchmark.json', 'scripts/install_volepsi.py', 'scripts/run_volepsi_benchmark.py', '.github/workflows/volepsi.yml']
permissions:
  contents: read
jobs:
  volepsi:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential git autoconf automake libtool libssl-dev
          python3 -m pip install cmake==3.31.6 numpy==1.26.4
      - name: Build pinned native upstream
        run: python3 scripts/install_volepsi.py
      - name: Exact correctness, negative input and scale checks
        run: python3 scripts/run_volepsi_benchmark.py
      - name: Preserve results and build failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: volepsi-${{ github.run_id }}-${{ github.run_attempt }}
          path: results-volepsi/
          retention-days: 30
